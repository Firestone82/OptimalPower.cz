<div class="container footer-bottom">
  <span class="copyright">
    <app-icon name="copyright" [size]="16" />
    {{ companyName() }} {{ foundedYear() }}–{{ currentYear }}
  </span>
  @if (consent.required()) {
    <button type="button" class="cookie-settings" (click)="consent.reopen()">
      {{ 'cookies.settings' | t }}
    </button>
  }
</div>
