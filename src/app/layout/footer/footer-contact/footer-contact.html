<h2 class="footer-title">{{ 'footer.contact' | t }}</h2>
<ul class="footer-list">
  <li><ng-icon name="lucideMapPin" /> {{ company().address }}</li>
  <li>
    <ng-icon name="lucideMail" />
    <a [href]="toMailHref(company().email)">{{ company().email }}</a>
  </li>
  <li>
    <ng-icon name="lucidePhone" />
    <a [href]="toPhoneHref(company().phone)">{{ company().phone }}</a>
  </li>
</ul>
