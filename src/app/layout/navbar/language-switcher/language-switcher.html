<div class="language-switcher" role="group" [attr.aria-label]="'nav.language' | t">
  @for (language of languages; track language) {
    <button
      type="button"
      [class.active]="language === i18n.language()"
      [attr.aria-pressed]="language === i18n.language()"
      [attr.lang]="language"
      [attr.title]="'languages.' + language | t"
      (click)="switchTo(language)"
    >
      {{ language }}
    </button>
  }
</div>
