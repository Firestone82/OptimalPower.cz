<dl class="contact-details">
  @for (row of rows(); track row.labelKey) {
    <div class="contact-row">
      <span class="contact-icon"><app-icon [name]="row.icon" [size]="18" /></span>
      <dt>{{ row.labelKey | t }}</dt>
      <dd>
        @if (row.encodedEmail) {
          <app-protected-email [encoded]="row.encodedEmail" />
        } @else if (row.href) {
          <a [href]="row.href">{{ row.value }}</a>
        } @else {
          {{ row.value }}
        }
      </dd>
    </div>
  }
</dl>
