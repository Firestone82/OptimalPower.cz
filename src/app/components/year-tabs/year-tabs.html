<div class="year-tabs" role="group" [attr.aria-label]="label()">
  @for (year of years(); track year) {
    <button
      type="button"
      [class.active]="year === selected()"
      [attr.aria-pressed]="year === selected()"
      (click)="selected.set(year)"
    >
      {{ year }}
    </button>
  }
</div>
