name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false

      # Before the build: prerendered pages embed the content they loaded, contact.json included.
      - name: Inject Web3Forms access key
        if: github.event_name != 'pull_request'
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: node scripts/inject-form-key.mjs public/content/contact.json

      # Prerenders every page and writes sitemap.xml (postbuild).
      - run: npm run build

      # Pages are prerendered; unknown paths get the client rendered shell, which shows the 404 page.
      - name: Add 404 page
        run: cp dist/optimalpower-web/browser/index.csr.html dist/optimalpower-web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/optimalpower-web/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
